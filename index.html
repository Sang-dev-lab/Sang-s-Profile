    <style>
        /* ==========================================
           1. CSS VARIABLES & THEMES
           ========================================== */
        :root {
            --bg-base: #06050e;
            --card-bg: rgba(18, 14, 36, 0.55);
            --card-border: rgba(255, 255, 255, 0.12);
            --rainbow-grad: linear-gradient(135deg, #ff007f, #ff7f00, #ffeb3b, #00ff87, #00d2ff, #7a00ff, #ff007f);
            --glow-color: rgba(255, 0, 127, 0.35);
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.85);
        }

        [data-theme="pastel-dream"] {
            --bg-base: #0c0817;
            --card-bg: rgba(30, 20, 50, 0.6);
            --card-border: rgba(255, 182, 193, 0.3);
            --rainbow-grad: linear-gradient(135deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb, #e0c3fc, #ff9a9e);
            --glow-color: rgba(255, 154, 158, 0.4);
        }

        [data-theme="cyberpunk-pink"] {
            --bg-base: #0f0015;
            --card-bg: rgba(35, 2, 40, 0.65);
            --card-border: rgba(255, 0, 150, 0.35);
            --rainbow-grad: linear-gradient(135deg, #ff007f, #00f0ff, #ffe600, #ff007f);
            --glow-color: rgba(0, 240, 255, 0.4);
        }

        [data-theme="gold-cosmic"] {
            --bg-base: #0c0a04;
            --card-bg: rgba(28, 22, 10, 0.65);
            --card-border: rgba(255, 215, 0, 0.3);
            --rainbow-grad: linear-gradient(135deg, #ffe066, #f59e0b, #d97706, #ffe066);
            --glow-color: rgba(245, 158, 11, 0.4);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            transition: background-color 0.5s ease;
        }

        .font-display {
            font-family: 'Space Grotesk', sans-serif;
        }

        /* Đồng bộ 100% Rainbow Gradient Text */
        .rainbow-text-sync {
            background: var(--rainbow-grad);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowFlow 6s linear infinite;
        }

        @keyframes rainbowFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Card Style */
        .glass-cyber {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-cyber:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 14px 40px var(--glow-color);
        }

        /* Viền cầu vồng Neon động */
        .rainbow-neon-border {
            position: relative;
        }
        .rainbow-neon-border::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: inherit;
            padding: 2px;
            background: var(--rainbow-grad);
            background-size: 200% 200%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: rainbowFlow 4s linear infinite;
            pointer-events: none;
        }
